[project]
name = "aiwins"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "chromadb>=1.5.9",
    "deepagents>=0.7.24",
    "google-genai>=2.29.0",
    "google-serp-api>=1.0.5",
    "googlescraper>=0.2.4",
    "gradio>=6.30.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.2",
    "ollama>=0.6.3",
    "openai>=3.29.0",
    "openai-agents>=0.23.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
]

[project.scripts]
aiwins = "aiwins:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.1",
]
